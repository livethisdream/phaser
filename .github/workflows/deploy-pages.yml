# Publish the beamforming dashboard to GitHub Pages, running the in-browser
# simulator.
#
# Pages serves static files: no Python, no WebSocket, so there is no
# phaser_headless.py to talk to. The build sets VITE_TRANSPORT=sim, which makes
# frontend/src/transport.js pick the simulator in frontend/src/sim/ instead of
# a backend. The result is the real dashboard -- same controls, same plots,
# same physics -- driven by synthesized IQ.
#
# ONE-TIME SETUP: Settings -> Pages -> Source -> "GitHub Actions". Until that is
# switched on, this workflow's deploy step fails with a 404.
name: Deploy Pages demo

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/vite.config.js'
      - 'tools/vendor_plotly.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but let an in-flight one finish rather than
# cancelling it -- a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Same Node major as build-frontends.yml: the committed lockfile was
          # generated by the npm it bundles.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11

      - uses: actions/configure-pages@v5

      # This build is NOT the committed frontend/dist -- that one is what
      # deploy.py ships to the Pi, and it must keep defaulting to the real
      # backend. Building into a separate directory keeps the sim default from
      # ever reaching hardware.
      - name: Build the dashboard in simulator mode
        working-directory: frontend
        env:
          VITE_TRANSPORT: sim
        run: |
          npm ci
          npm run build -- --outDir dist-pages

      # Same guarantee the Pi build gets: no CDN, no Google Fonts, nothing
      # fetched at runtime. A classroom behind a captive portal should still
      # get a working page.
      - name: Verify the build is self-contained
        run: |
          fail=0
          if grep -nE '(src|href)="https?://' frontend/dist-pages/index.html; then
            echo "::error::Page loads an external resource; it must be vendored."
            fail=1
          fi
          while IFS= read -r css; do
            if grep -nE 'url\(\s*["'"'"']?https?://' "$css"; then
              echo "::error file=$css::Stylesheet fetches an external resource."
              fail=1
            fi
          done < <(find frontend/dist-pages -name '*.css')
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Build is fully self-contained."

      # The whole point of the deploy: prove the page actually simulates before
      # publishing it. A build that compiles but throws on load would otherwise
      # ship silently.
      - name: Smoke-test the simulator in a real browser
        working-directory: frontend
        run: |
          # Two separate things: the npm package (so the script below can
          # import it) and the browser binaries. `npx playwright install`
          # only does the latter.
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node --input-type=module -e "
          import { chromium } from 'playwright';
          import http from 'node:http';
          import { readFile } from 'node:fs/promises';
          import path from 'node:path';

          const TYPES = { '.html':'text/html', '.js':'text/javascript',
                          '.css':'text/css', '.png':'image/png',
                          '.woff2':'font/woff2', '.json':'application/json' };
          const server = http.createServer(async (req, res) => {
            try {
              const rel = decodeURIComponent(req.url.split('?')[0]);
              const file = path.join('dist-pages', rel === '/' ? 'index.html' : rel);
              const body = await readFile(file);
              res.writeHead(200, { 'Content-Type': TYPES[path.extname(file)] || 'application/octet-stream' });
              res.end(body);
            } catch { res.writeHead(404); res.end('nope'); }
          });
          await new Promise((r) => server.listen(8123, r));

          const browser = await chromium.launch();
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', (e) => errors.push(String(e)));
          await page.goto('http://127.0.0.1:8123/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(1500);

          const banner = await page.isVisible('#sim-banner');
          if (!banner) throw new Error('simulation banner did not appear — is VITE_TRANSPORT=sim set?');

          await page.click('#btn-sweep');
          await page.waitForTimeout(5000);
          const plot = await page.evaluate(() => {
            const el = document.getElementById('chart-rect');
            if (!el?.data?.length) return null;
            const t = el.data[0];
            let pk = 0;
            for (let i = 1; i < t.y.length; i++) if (t.y[i] > t.y[pk]) pk = i;
            return { n: t.y.length, peakX: t.x[pk], peakY: t.y[pk] };
          });
          if (!plot) throw new Error('no sweep data reached the plot');
          if (plot.n < 100) throw new Error('sweep produced only ' + plot.n + ' points');
          // Target sits at boresight, so the main lobe belongs at 0 deg.
          if (Math.abs(plot.peakX) > 3) throw new Error('beam peaked at ' + plot.peakX + ' deg, expected ~0');
          if (errors.length) throw new Error('page errors: ' + errors.join('; '));

          console.log('OK: ' + plot.n + ' points, peak ' + plot.peakY.toFixed(2) + ' dBFS at ' + plot.peakX + ' deg');
          await browser.close();
          server.close();
          "

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
