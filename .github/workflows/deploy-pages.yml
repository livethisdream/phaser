# Publish the beamforming dashboard to GitHub Pages, running the in-browser
# simulator, with the radar UI and its simulator beside it at /radar/.
#
# Pages serves static files: no Python, no WebSocket, so there is no
# phaser_headless.py to talk to. The build sets VITE_TRANSPORT=sim, which makes
# frontend/src/transport.js pick the simulator in frontend/src/sim/ instead of
# a backend. The result is the real dashboard -- same controls, same plots,
# same physics -- driven by synthesized IQ.
#
# ONE-TIME SETUP: Settings -> Pages -> Source -> "GitHub Actions". Until that is
# switched on, this workflow's deploy step fails with a 404.
name: Deploy Pages demo

# The smoke test below is the only end-to-end test the frontend has, so it runs
# on pull requests as well -- it used to run on push to main, which meant a
# simulator broken by a merge was discovered from the published demo. PRs build
# and test; only main publishes.
on:
  push:
    branches: [main]
    paths: &frontend_paths
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/vite.config.js'
      - 'frontend-radar/src/**'
      - 'frontend-radar/public/**'
      - 'frontend-radar/index.html'
      - 'frontend-radar/package.json'
      - 'frontend-radar/package-lock.json'
      - 'frontend-radar/vite.config.js'
      - 'tools/vendor_plotly.mjs'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths: *frontend_paths
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Grouped per ref so PR checks do not queue behind a deploy. A superseded PR run
# is worth canceling; a deploy in flight is not -- a half-published site is
# worse than a slightly stale one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Same Node major as build-frontends.yml: the committed lockfile was
          # generated by the npm it bundles.
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-radar/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      # This build is NOT the committed frontend/dist -- that one is what
      # install.sh ships to the Pi, and it must keep defaulting to the real
      # backend. Building into a separate directory keeps the sim default from
      # ever reaching hardware.
      - name: Build the dashboard in simulator mode
        working-directory: frontend
        env:
          VITE_TRANSPORT: sim
        run: |
          npm ci
          npm run build -- --outDir dist-pages

      # The radar UI, also in simulator mode, published under the dashboard at
      # radar/. Same separate-directory rule as above: frontend-radar/dist is
      # what install.sh ships to the Pi's :8081.
      - name: Build the radar UI in simulator mode
        working-directory: frontend-radar
        env:
          VITE_TRANSPORT: sim
        run: |
          npm ci
          npm run build -- --outDir dist-pages
          rm -rf ../frontend/dist-pages/radar
          cp -r dist-pages ../frontend/dist-pages/radar

      # Same guarantee the Pi build gets: no CDN, no Google Fonts, nothing
      # fetched at runtime. A classroom behind a captive portal should still
      # get a working page.
      - name: Verify the build is self-contained
        run: |
          fail=0
          for html in frontend/dist-pages/index.html frontend/dist-pages/radar/index.html; do
            if grep -nE '(src|href)="https?://' "$html"; then
              echo "::error file=$html::Page loads an external resource; it must be vendored."
              fail=1
            fi
          done
          while IFS= read -r css; do
            if grep -nE 'url\(\s*["'"'"']?https?://' "$css"; then
              echo "::error file=$css::Stylesheet fetches an external resource."
              fail=1
            fi
          done < <(find frontend/dist-pages -name '*.css')
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Build is fully self-contained."

      # The inverse of build-frontends.yml's check on frontend/dist/. Pages has
      # no backend, so a hardware-mode build published here would sit forever
      # trying to open a WebSocket to github.io.
      - name: Verify the build targets the simulator, not a backend
        run: |
          for html in frontend/dist-pages/index.html frontend/dist-pages/radar/index.html; do
            mode="$(sed -n 's/.*<meta name="phaser-transport" content="\([a-z]*\)".*/\1/p' \
                    "$html" | head -n1)"
            if [ "$mode" != "sim" ]; then
              echo "::error file=$html::marked '$mode', expected 'sim'."
              echo "Pages is static; a backend build has nothing to connect to."
              exit 1
            fi
          done
          echo "OK: both Pages builds run the in-browser simulator."

      # The whole point of the deploy: prove the page actually simulates before
      # publishing it. A build that compiles but throws on load would otherwise
      # ship silently.
      - name: Smoke-test the simulator in a real browser
        working-directory: frontend
        run: |
          # Two separate things: the npm package (so the script below can
          # import it) and the browser binaries. `npx playwright install`
          # only does the latter.
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

          # Write the script to a file rather than passing it to `node -e "..."`.
          # Inside double quotes the shell still interprets the JS: backticks
          # read as command substitution and ${...} as parameter expansion, so a
          # template literal gets eaten before node ever sees it. That silently
          # reduced the badge check below to `throw new Error()` -- it still
          # failed the build, but with an empty message instead of the one
          # naming the cause. The quoted 'EOF' stops the shell touching any of
          # it.
          #
          # The file goes here in frontend/, not /tmp: node resolves a bare
          # `import ... from 'playwright'` relative to the importing file, not
          # the working directory, so a script in /tmp cannot see the
          # node_modules installed above.
          cat > pages-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import http from 'node:http';
          import { readFile } from 'node:fs/promises';
          import path from 'node:path';

          const TYPES = { '.html':'text/html', '.js':'text/javascript',
                          '.css':'text/css', '.png':'image/png',
                          '.woff2':'font/woff2', '.json':'application/json' };
          const server = http.createServer(async (req, res) => {
            try {
              let rel = decodeURIComponent(req.url.split('?')[0]);
              // A directory URL (/, /radar/) serves its index.html, as Pages does.
              if (rel.endsWith('/')) rel += 'index.html';
              const file = path.join('dist-pages', rel);
              const body = await readFile(file);
              res.writeHead(200, { 'Content-Type': TYPES[path.extname(file)] || 'application/octet-stream' });
              res.end(body);
            } catch { res.writeHead(404); res.end('nope'); }
          });
          await new Promise((r) => server.listen(8123, r));

          const browser = await chromium.launch();
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', (e) => errors.push(String(e)));
          await page.goto('http://127.0.0.1:8123/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(1500);

          // The connection pill must read "Simulated". Assert on the text, not
          // just presence: a hardware-mode build on Pages has no backend and
          // reads "Disconnected", so this is what stops one from publishing.
          const pill = (await page.textContent('#connection-text').catch(() => null) || '').trim();
          if (pill !== 'Simulated') {
            throw new Error(`expected the connection pill to read Simulated, got ${JSON.stringify(pill)} — is VITE_TRANSPORT=sim set?`);
          }

          await page.click('#btn-sweep');
          await page.waitForTimeout(5000);
          const plot = await page.evaluate(() => {
            const el = document.getElementById('chart-rect');
            if (!el?.data?.length) return null;
            const t = el.data[0];
            let pk = 0;
            for (let i = 1; i < t.y.length; i++) if (t.y[i] > t.y[pk]) pk = i;
            return { n: t.y.length, peakX: t.x[pk], peakY: t.y[pk] };
          });
          if (!plot) throw new Error('no sweep data reached the plot');
          if (plot.n < 100) throw new Error(`sweep produced only ${plot.n} points`);
          // Target sits at boresight, so the main lobe belongs at 0 deg.
          if (Math.abs(plot.peakX) > 3) throw new Error(`beam peaked at ${plot.peakX} deg, expected ~0`);

          // Dragging the HB100 on the Polar tab. main.js turns the pointer
          // into an angle with Plotly-internal geometry
          // (_fullLayout.polar._subplot.cx/cy/radius); this is what catches a
          // Plotly upgrade that moves it, by doing the drag for real and
          // checking the beam follows. Plot Options > Show HB100 starts off,
          // so turn it on first, as a user would.
          await page.evaluate(() => {
            const t = document.getElementById('opt-show-hb100');
            if (!t) throw new Error('Plot Options > Show HB100 (#opt-show-hb100) is gone');
            t.checked = true;
            t.dispatchEvent(new Event('change'));
          });
          await page.click('.tab-btn[data-target="tab-polar"]');
          await page.waitForTimeout(1000);
          const geo = await page.evaluate(() => {
            const el = document.getElementById('chart-polar');
            const sp = el?._fullLayout?.polar?._subplot;
            if (!sp || ![sp.cx, sp.cy, sp.radius].every(Number.isFinite)) return null;
            const box = el.getBoundingClientRect();
            // The HB100 marker (trace 4): its radius is where its range puts
            // it, read back off the trace rather than assumed.
            const [rMin, rMax] = el.layout.polar.radialaxis.range;
            const m = el.data[4];
            const frac = (m.r[0] - rMin) / (rMax - rMin);
            const a = ((90 - m.theta[0]) * Math.PI) / 180;
            return { cx: box.left + sp.cx, cy: box.top + sp.cy, r: sp.radius,
                     mx: box.left + sp.cx + sp.radius * frac * Math.sin(a),
                     my: box.top + sp.cy - sp.radius * frac * Math.cos(a) };
          });
          if (!geo) throw new Error('Plotly polar geometry (_fullLayout.polar._subplot cx/cy/radius) is gone; the Polar source drag in main.js needs updating');
          await page.mouse.move(geo.mx, geo.my);
          await page.mouse.down();
          const a = (30 * Math.PI) / 180;
          await page.mouse.move(geo.cx + geo.r * 0.7 * Math.sin(a), geo.cy - geo.r * 0.7 * Math.cos(a), { steps: 10 });
          await page.mouse.up();
          await page.waitForTimeout(4000);
          const dragged = await page.evaluate(() => {
            const t = document.getElementById('chart-rect').data[0];
            let pk = 0;
            for (let i = 1; i < t.y.length; i++) if (t.y[i] > t.y[pk]) pk = i;
            return t.x[pk];
          });
          if (Math.abs(dragged - 30) > 3) throw new Error(`after dragging the HB100 to 30 deg the beam peaked at ${dragged} deg`);
          // The drag also moved it outward, so its label carries a new range.
          const label = await page.evaluate(() => document.getElementById('chart-polar').data[4].text[0]);
          if (!/^HB100 30° · [\d.]+ m$/.test(label) || label.endsWith(' 1.0 m')) {
            throw new Error(`HB100 label after the drag was ${JSON.stringify(label)}; expected 30° at a new range`);
          }
          console.log(`OK: Polar drag moved the HB100; beam now peaks at ${dragged} deg`);

          if (errors.length) throw new Error(`page errors: ${errors.join('; ')}`);

          console.log(`OK: ${plot.n} points, peak ${plot.peakY.toFixed(2)} dBFS at ${plot.peakX} deg`);

          // The radar UI at radar/: Simulated, and FMCW streams the default
          // live scene -- a person walking 1 m to 4 m and back at 1 m/s -- so
          // the peak is in that span, and it moves.
          const radar = await browser.newPage();
          const radarErrors = [];
          radar.on('pageerror', (e) => radarErrors.push(String(e)));
          await radar.goto('http://127.0.0.1:8123/radar/', { waitUntil: 'networkidle' });
          await radar.waitForTimeout(1500);
          const rpill = (await radar.textContent('#connection-text').catch(() => null) || '').trim();
          if (rpill !== 'Simulated') throw new Error(`radar: expected Simulated, got ${JSON.stringify(rpill)}`);
          await radar.click('#mode-fmcw');
          await radar.click('#btn-radar');
          await radar.waitForTimeout(4000);
          const rng = parseFloat(await radar.textContent('#stat-peak-range'));
          const vel = parseFloat(await radar.textContent('#stat-peak-vel'));
          if (!(rng > 0.5 && rng < 4.5 && Math.abs(vel) < 3)) {
            throw new Error(`radar: peak read ${rng} m / ${vel} m/s, expected the walker, 1-4 m`);
          }
          // Moves: over any 3 s the walker covers at least 1.5 m (out and back
          // is 6 s), even across a turn, so the readings must spread.
          const seen = [rng];
          for (let i = 0; i < 6; i++) {
            await radar.waitForTimeout(500);
            seen.push(parseFloat(await radar.textContent('#stat-peak-range')));
          }
          const spread = Math.max(...seen) - Math.min(...seen);
          if (spread < 0.5) {
            throw new Error(`radar: the walker did not move over 3 s: ${seen.join(', ')} m`);
          }
          if (radarErrors.length) throw new Error(`radar page errors: ${radarErrors.join('; ')}`);
          console.log(`OK: radar FMCW walker moved ${spread.toFixed(2)} m in 3 s (${seen.join(', ')} m), ${vel} m/s`);
          await browser.close();
          server.close();
          EOF
          node pages-smoke.mjs
          rm -f pages-smoke.mjs

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: frontend/dist-pages

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
