# Run the Python test suite.
#
# This repo had 11 test files and nothing executing any of them, so a failing
# test only surfaced for whoever happened to run pytest locally. That matters
# more than usual now: tests/test_sim_parity.py is what stops the JavaScript
# simulator in frontend/src/sim/ drifting away from phaser_sim.py, and a drift
# guard nobody runs is not a guard.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # test_sim_parity.py drives frontend/src/sim/engine.js through node and
      # compares it against do_sweep(). Without node those tests skip, which
      # would silently defeat the point of running them here.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # tools/build_kit_image.py writes into a FAT filesystem with mtools, and
      # the end-to-end builder test lays down a real one with mkfs.vfat. Both
      # skip themselves if absent, and a skipped test that builds SD card
      # images looks exactly like a passing one.
      - name: Install mtools and dosfstools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mtools dosfstools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyadi-iio is deliberately absent: it binds libiio at import and the
          # tests stub it. Everything here is what phaser_headless needs to be
          # importable plus the test runner itself.
          pip install numpy pyzmq msgpack pytest pytest-asyncio pytest-mock

      - name: Check the generated sim constants are current
        run: |
          python tools/gen_sim_constants.py
          if ! git diff --exit-code -- frontend/src/sim/constants.generated.js; then
            echo "::error::frontend/src/sim/constants.generated.js is stale."
            echo "A simulator constant changed in Python without regenerating the JS."
            echo "Run: python tools/gen_sim_constants.py"
            exit 1
          fi

      # ubuntu-latest ships shellcheck, but say so explicitly: the pytest
      # shellcheck tests skip themselves when the binary is absent, and a
      # skipped check looks exactly like a passing one.
      - name: Lint the shell scripts
        run: |
          shellcheck --version
          shellcheck -S warning -e SC1091 \
            install.sh \
            scripts/provision.sh \
            scripts/pi/phaser-clock \
            scripts/pi/phaser-firstboot \
            scripts/pi/phaser-netalias \
            scripts/pi/pluto_update_ad9361.sh
          # POSIX sh, not bash: it runs before much of userspace exists.
          shellcheck -S warning -s sh scripts/pi/firstrun.sh

      - name: Run tests
        run: python -m pytest -q

      # Same reasoning as the parity guard below: this one builds a real
      # FAT image and reads it back, and is the only test that exercises the
      # MBR parse and the cmdline round-trip end to end.
      - name: Confirm the image-builder test actually ran
        run: |
          python -m pytest tests/test_provision_sh.py -q -rs \
            -k test_builder_end_to_end_against_a_real_fat_image 2>&1 | tee /tmp/builder.log
          if grep -qE '^[0-9]+ skipped|SKIPPED' /tmp/builder.log; then
            echo "::error::the image-builder end-to-end test skipped; it must run in CI."
            exit 1
          fi

      # Fail loudly if the parity suite silently skipped itself -- a skipped
      # drift guard looks exactly like a passing one in the summary.
      - name: Confirm the sim parity tests actually ran
        run: |
          python -m pytest tests/test_sim_parity.py -q --collect-only > /dev/null
          python -m pytest tests/test_sim_parity.py -q -rs 2>&1 | tee /tmp/parity.log
          if grep -qE '^[0-9]+ skipped|SKIPPED' /tmp/parity.log; then
            echo "::error::sim parity tests skipped; they must run in CI."
            exit 1
          fi
