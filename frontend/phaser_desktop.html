<!DOCTYPE html>
<!--
  phaser_desktop.html — Desktop build entry point
  ================================================
  Replaces index.html in the Tauri / PyWebView / Electron desktop shell.

  The desktop host MUST inject one of the following before the app scripts run:
    a) window.__TAURI__ (Tauri sidecar) — provided automatically by Tauri
    b) window.__PHASER_PIPE = { send(str), onMessage(cb) } — generic stdio pipe

  The ipc-bridge-native.js module reads whichever channel is present and
  installs window.__PHASER_IPC_BRIDGE so the transport facade uses IPC mode.

  Build command (example, Vite):
      VITE_TRANSPORT=ipc npx vite build --outDir dist-desktop
  (or set VITE_TRANSPORT=ipc in .env.desktop)
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADI Phaser Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <link rel="stylesheet" href="./src/style.css" />

  <!--
    Desktop-only: tell the transport facade to use IPC before main.js loads.
    The native bridge module will pick up __TAURI__ or __PHASER_PIPE.
  -->
  <script>
    window.__PHASER_TRANSPORT = 'ipc';
  </script>
</head>
<body>
  <!-- ============================================================
       Body is identical to index.html — keep in sync.
       (In a real build pipeline this would be a shared partial.)
       ============================================================ -->

  <!--
    Paste the full <body> content from index.html here, OR let your
    build tool (Vite, Rollup) merge the templates.  The only difference
    from index.html is the <script> block above and the module load below.
  -->

  <!--
    The desktop entry replaces main.js's ipc-bridge-mock.js import with
    ipc-bridge-native.js.  If using Vite, define a separate entry file:

        frontend/src/main-desktop.js:
            import './ipc-bridge-native.js';
            // rest is identical to main.js from here
            import './main-body.js';   // shared logic extracted from main.js

    For now, a quick approach: include native bridge before main.js.
  -->
  <script type="module">
    // Install the native bridge synchronously before main loads.
    // This works because both are ES modules — imports execute in order.
    await import('./src/ipc-bridge-native.js');
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
