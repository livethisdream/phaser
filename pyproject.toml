[project]
name = "phaser"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "psutil>=7.2.2",
    "pyadi-iio>=0.0.20",
    "pydantic>=2.13.3",
    "pyzmq>=27.1.0",
    "scipy>=1.17.1",
    "uvicorn>=0.44.0",
    "websockets>=16.0",
    "pywebview>=5.1",
    "msgpack>=1.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "httpx>=0.24.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Backend modules live at the repo root, so tests can import them directly.
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "unit: unit tests (fast, no I/O)",
    "integration: integration tests (may involve service startup)",
    "slow: slow tests (hardware-like operations)",
    "hardware: tests that require a live Phaser device (skipped by default)",
]
# Ignore pyadi-iio warnings and SDK-specific issues
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.setuptools]
# No packages: the repo is root-level modules only. Naming an empty list keeps
# setuptools' auto-discovery from guessing at directories like tests/ or docs/.
packages = []

# Root-level Python modules only; other subdirectories are not packages.
# The previous list named six modules that no longer exist (phaser_app,
# phaser_cal, phaser_find_hb100, phaser_gui, phaser_ipc_worker,
# phaser_server) -- leftovers from the pre-headless GUI architecture.
py-modules = [
    "ADAR_pyadi_functions",
    "config",
    "phaser_cal_headless",
    "phaser_cw_radar",
    "phaser_find_hb100_headless",
    "phaser_functions",
    "phaser_headless",
    "phaser_radar_dsp",
    "phaser_service",
    "phaser_sim",
    "SDR_functions",
]
