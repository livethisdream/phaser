[project]
name = "phaser"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "psutil>=7.2.2",
    "pyadi-iio>=0.0.20",
    "pydantic>=2.13.3",
    "pyzmq>=27.1.0",
    "scipy>=1.17.1",
    "uvicorn>=0.44.0",
    "websockets>=16.0",
    "pywebview>=5.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "httpx>=0.24.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "unit: unit tests (fast, no I/O)",
    "integration: integration tests (may involve service startup)",
    "slow: slow tests (hardware-like operations)",
    "hardware: tests that require a live Phaser device (skipped by default)",
]
# Ignore pyadi-iio warnings and SDK-specific issues
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.setuptools]
# Explicitly include only the root-level Python modules, exclude subdirectories
py-modules = [
    "ADAR_pyadi_functions",
    "config",
    "phaser_app",
    "phaser_cal",
    "phaser_find_hb100",
    "phaser_functions",
    "phaser_gui",
    "phaser_ipc_worker",
    "phaser_server",
    "phaser_service",
    "SDR_functions",
]
